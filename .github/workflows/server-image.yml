name: Server image

# The server's image pharndt/ai-connector-server (Dockerfile), pushed to Docker Hub on a version tag:
#   git tag server-v0.1.0 && git push origin server-v0.1.0   →   pharndt/ai-connector-server:0.1.0 and :latest
# The Go and web stages cross-compile on the runner (--platform=$BUILDPLATFORM), so no QEMU is needed. Both web apps
# (web/ and console/) are built inside the Dockerfile (pnpm install --frozen-lockfile && pnpm build) and embedded,
# and the worker programs for the four platforms are built into /tools; `make image-multiarch` is the same locally.
# The chart (deploy/helm/ai-connector) is checked by ci.yml; its appVersion is the tag's version to deploy.
on:
  push:
    tags: ["server-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#server-v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build docker container and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            pharndt/ai-connector-server:latest
            pharndt/ai-connector-server:${{ steps.version.outputs.version }}

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ai-connector-server ${{ steps.version.outputs.version }}
          generateReleaseNotes: true
          body: |
            Docker tag: `pharndt/ai-connector-server:${{ steps.version.outputs.version }}`
          draft: false
          prerelease: false
