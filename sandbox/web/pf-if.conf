# pf anchor "com.apple/mlxlab-web-if": rules by interface for the two vmnet bridges of the web sandbox.
#
# pf.conf matches by source subnet; a VM whose kernel is compromised could send from another address, or over
# IPv6 link-local (the Mac answers on fe80::…%bridgeN for services listening on [::]). These rules close that by
# interface. The bridges exist only while a container of the network runs, and their names can change when the
# networks are recreated, so `make sandbox-firewall` finds them (from the gateway addresses) and loads this
# anchor only when the sandbox is up; run it again after a restart of the container system.
#
# Macros (from `make sandbox-firewall`): int_if, ext_if, int_net, ext_net, int_gw, ext_gw.

table <mlxlab_web_private> const { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, \
	172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.18.0.0/15, \
	198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4 }

# no IPv6 at all from the sandbox networks
block drop in quick log on $int_if inet6 all
block drop in quick log on $ext_if inet6 all

# isolated network: nothing for the Mac, whatever the source address
block drop in quick log on $int_if inet from any to { $int_gw, $ext_gw, self }
pass in quick on $int_if inet from $int_net to $int_net
block drop in quick log on $int_if all

# the proxy's network: only its own addresses, only to the public internet
block drop in quick log on $ext_if inet from ! $ext_net to any
block drop in quick log on $ext_if inet from any to { $int_gw, $ext_gw, self }
block drop in quick log on $ext_if inet from any to <mlxlab_web_private>
pass in quick on $ext_if inet proto tcp from $ext_net to ! <mlxlab_web_private> port { 80, 443 } keep state
pass in quick on $ext_if inet proto { tcp, udp } from $ext_net to ! <mlxlab_web_private> port 53 keep state
block drop in quick log on $ext_if all
