# pf anchor for mlxlab's web sandbox (load with `make sandbox-firewall`, needs sudo).
#
# The second wall: inside the VMs the lockdown entrypoint already removes the routes to the Mac and the LAN and
# the services run without any capability. These rules hold even if a VM's kernel is compromised (root in the VM
# can re-add routes): nothing from the isolated network reaches the Mac, and the proxy's network reaches only the
# public internet (DNS, HTTP, HTTPS).
#
# Loaded into "com.apple/mlxlab-web", which the stock /etc/pf.conf evaluates (anchor "com.apple/*").
# `make sandbox-firewall` passes the subnets with -D (they override the defaults below).

int_net = "192.168.240.0/24"   # mlxlab-web-int: tools, SearXNG, the proxy's inner leg (host-only)
ext_net = "192.168.241.0/24"   # mlxlab-web-ext: the proxy's way out (NAT)
int_gw  = "192.168.240.1"      # the Mac on each network (named explicitly: "self" is expanded at load time,
ext_gw  = "192.168.241.1"      # when the bridges may not exist yet)

table <mlxlab_web_private> const { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, \
	172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.18.0.0/15, \
	198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4 }

# isolated network: never the Mac; between the sandbox VMs only (if the bridge filters its members at all)
block drop in quick log inet from $int_net to { $int_gw, $ext_gw, self }
pass in quick inet from $int_net to $int_net
block drop in quick log inet from $int_net to any

# the proxy's network: never the Mac, the LAN or anything private; public DNS, HTTP and HTTPS only
block drop in quick log inet from $ext_net to { $int_gw, $ext_gw, self }
block drop in quick log inet from $ext_net to <mlxlab_web_private>
pass in quick inet proto tcp from $ext_net to ! <mlxlab_web_private> port { 80, 443 } keep state
pass in quick inet proto { tcp, udp } from $ext_net to ! <mlxlab_web_private> port 53 keep state
block drop in quick log inet from $ext_net to any
