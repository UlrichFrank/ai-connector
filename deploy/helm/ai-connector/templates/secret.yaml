{{- if not .Values.existingSecret }}
{{- if not .Values.secrets.MLXLAB_PASSWORD }}
{{- fail "secrets.MLXLAB_PASSWORD is required (or existingSecret): without a password the server refuses to start" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-connector.secretName" . }}
  labels:
    {{- include "ai-connector.labels" . | nindent 4 }}
type: Opaque
data:
{{- range $key, $value := .Values.secrets }}
{{- if $value }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
