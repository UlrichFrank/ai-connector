apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-connector.fullname" . }}
  labels:
    {{- include "ai-connector.labels" . | nindent 4 }}
spec:
  # One server: the worker tunnel, the sessions and the JSON stores in /data live in this process. Recreate, not
  # RollingUpdate: two servers would split the workers, and the ReadWriteOnce PVC would hold the new pod up.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ai-connector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.existingSecret }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ai-connector.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- if include "ai-connector.mdnsInProcess" . }}
      # Bonjour's multicast reaches the LAN only from the node's network
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if include "ai-connector.mdnsAvahi" . }}
      initContainers:
        # Bonjour through the node's avahi: write the announcement into its services dir (avahi watches it), so
        # the server needs no hostNetwork. Root only to write that root-owned dir; nothing else is mounted.
        - name: avahi-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - avahi-service
            - /avahi/{{ .Values.mdns.avahi.file }}
            - {{ .Values.mdns.avahi.port | quote }}
          env:
            {{- with .Values.publicURL }}
            - name: MLXLAB_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.mdns.name }}
            - name: MLXLAB_MDNS_NAME
              value: {{ . | quote }}
            {{- end }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: avahi-services
              mountPath: /avahi
          resources:
            limits:
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 16Mi
      {{- end }}
      containers:
        - name: server
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: MLXLAB_DATA
              value: /data
            - name: MLXLAB_ADDR
              value: {{ printf ":%v" .Values.service.port | quote }}
            {{- with .Values.hosts.console }}
            - name: MLXLAB_CONSOLE_HOSTS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.publicURL }}
            - name: MLXLAB_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            - name: MLXLAB_MDNS
              value: {{ ternary "1" "0" (include "ai-connector.mdnsInProcess" . | eq "true") | quote }}
            {{- if and (include "ai-connector.mdnsInProcess" .) .Values.mdns.name }}
            - name: MLXLAB_MDNS_NAME
              value: {{ .Values.mdns.name | quote }}
            {{- end }}
            {{- with .Values.models.embed }}
            - name: MLXLAB_EMBED_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.models.classify }}
            - name: MLXLAB_CLASSIFY_MODEL
              value: {{ . | quote }}
            {{- end }}
            - name: MLXLAB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-connector.secretName" . }}
                  key: MLXLAB_PASSWORD
            - name: MLXLAB_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-connector.secretName" . }}
                  key: MLXLAB_WORKER_TOKEN
                  optional: true
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | toString | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            # the root filesystem is read-only; scratch space for Go (multipart temp files)
            - name: tmp
              mountPath: /tmp
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "ai-connector.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        {{- if include "ai-connector.mdnsAvahi" . }}
        - name: avahi-services
          hostPath:
            path: {{ .Values.mdns.avahi.servicesDir }}
            type: Directory
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
